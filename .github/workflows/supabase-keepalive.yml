name: Supabase Keep Alive

on:
  schedule:
    # Every day at 12:00 UTC
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Update heartbeat row
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" -c "
          UPDATE keepalive
          SET last_ping = NOW()
          WHERE id = 1;
          "
